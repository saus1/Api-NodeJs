<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f7fb">
    <title>Administrar productos</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #172033;
            background: #f5f7fb;
            font-synthesis: none;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 48px 20px;
        }

        main {
            width: min(100%, 960px);
            margin: 0 auto;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 24px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: clamp(1.7rem, 4vw, 2.2rem);
            letter-spacing: -0.04em;
        }

        header p,
        .hint {
            color: #64708a;
        }

        header p {
            margin: 0;
            line-height: 1.5;
        }

        section {
            margin-top: 20px;
            padding: 24px;
            border: 1px solid #e1e6f0;
            border-radius: 16px;
            background: #fff;
            box-shadow: 0 12px 32px rgb(34 49 82 / 5%);
        }

        h2 {
            margin: 0 0 18px;
            font-size: 1.1rem;
        }

        .fields {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
        }

        label {
            display: grid;
            gap: 7px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        input,
        textarea {
            width: 100%;
            min-height: 44px;
            padding: 10px 12px;
            border: 1px solid #cbd3e1;
            border-radius: 9px;
            background: #fff;
            color: inherit;
            font: inherit;
        }

        input:focus,
        textarea:focus {
            border-color: #5368df;
            outline: 3px solid rgb(83 104 223 / 15%);
        }

        textarea {
            min-height: 96px;
            resize: vertical;
        }

        .wide {
            grid-column: 1 / -1;
        }

        button {
            min-height: 44px;
            padding: 10px 16px;
            border: 0;
            border-radius: 9px;
            background: #4056d6;
            color: #fff;
            cursor: pointer;
            font: inherit;
            font-weight: 700;
        }

        button:hover:not(:disabled) {
            background: #3045c1;
        }

        button.secondary {
            flex-shrink: 0;
            border: 1px solid #cbd3e1;
            background: #fff;
            color: #172033;
        }

        button.secondary:hover:not(:disabled) {
            background: #f0f3f9;
        }

        button:disabled {
            cursor: wait;
            opacity: 0.65;
        }

        .form-actions {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-top: 18px;
        }

        .menu {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 22px 0;
        }

        .menu button {
            border: 1px solid #cbd3e1;
            background: #fff;
            color: #172033;
        }

        .menu button[aria-pressed="true"] {
            border-color: #4056d6;
            background: #4056d6;
            color: #fff;
        }

        .search-layout {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 20px;
        }

        .search-card {
            min-width: 0;
            padding: 18px;
            border: 1px solid #e1e6f0;
            border-radius: 12px;
        }

        .search-card h3 {
            margin: 0 0 14px;
            font-size: 1rem;
        }

        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th,
        td {
            padding: 11px 12px;
            border-bottom: 1px solid #e1e6f0;
            vertical-align: top;
        }

        th {
            background: #f5f7fb;
            font-size: 0.85rem;
        }

        td {
            overflow-wrap: anywhere;
            font-size: 0.9rem;
        }

        .cell-label {
            display: none;
        }

        #results-section {
            margin-top: 24px;
        }

        .hint {
            margin: 14px 0 0;
            font-size: 0.85rem;
        }

        [role="status"] {
            min-height: 1.4em;
            margin: 14px 0 0;
            font-size: 0.92rem;
        }

        [role="status"][data-kind="error"] {
            color: #b42318;
        }

        [role="status"][data-kind="success"] {
            color: #137547;
        }

        [hidden] {
            display: none !important;
        }

        @media (max-width: 560px) {
            body {
                padding: 28px 14px;
            }

            header {
                flex-direction: column;
                align-items: stretch;
                gap: 14px;
            }

            header button {
                align-self: flex-start;
            }

            section {
                padding: 20px 16px;
            }

            .fields {
                grid-template-columns: 1fr;
            }

            .wide {
                grid-column: auto;
            }

            .search-layout {
                grid-template-columns: 1fr;
            }

            .search-card .form-actions button {
                width: 100%;
            }

            #results-section {
                padding: 16px 12px;
            }

            .table-wrap {
                overflow: visible;
            }

            table,
            tbody,
            tbody tr,
            tbody td {
                display: block;
            }

            thead {
                display: none;
            }

            tbody tr {
                margin-bottom: 12px;
                overflow: hidden;
                border: 1px solid #e1e6f0;
                border-radius: 10px;
            }

            tbody td {
                display: grid;
                grid-template-columns: minmax(84px, 34%) minmax(0, 1fr);
                gap: 8px;
                border-bottom: 1px solid #e1e6f0;
            }

            .cell-label {
                display: block;
                color: #4b5670;
                font-weight: 700;
            }

            tbody td:last-child {
                border-bottom: 0;
            }
        }

        @media print {
            @page {
                margin: 16mm;
            }

            body {
                padding: 0;
                background: #fff;
            }

            body * {
                visibility: hidden;
            }

            #results-section,
            #results-section * {
                visibility: visible;
            }

            #results-section {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                margin: 0;
                padding: 0;
                border: 0;
                box-shadow: none;
            }

            .no-print {
                display: none !important;
            }

            th {
                background: #eee !important;
                print-color-adjust: exact;
            }
        }
    </style>
</head>
<body>
    <main>
        <header>
            <div>
                <h1>Administrar productos</h1>
                <p>Gestiona los productos guardados en la colección <strong>products</strong> de Firestore.</p>
            </div>
            <button id="logout-button" class="secondary" type="button">Cerrar sesión</button>
        </header>

        <nav class="menu no-print" aria-label="Menú principal">
            <button id="alta-tab" type="button" aria-pressed="true" aria-controls="alta-panel">Alta de productos</button>
            <button id="consulta-tab" type="button" aria-pressed="false" aria-controls="consulta-panel">Consulta de productos</button>
        </nav>

        <section id="alta-panel" role="region" aria-labelledby="alta-tab">
            <h2 id="product-title">Alta de producto</h2>
            <form id="product-form">
                <div class="fields">
                    <label>
                        Nombre
                        <input name="nombre" type="text" maxlength="120" required>
                    </label>
                    <label>
                        Categoría
                        <input name="categoria" type="text" maxlength="80" required>
                    </label>
                    <label>
                        Precio
                        <input name="precio" type="number" min="0" step="0.01" required>
                    </label>
                    <label>
                        Stock
                        <input name="stock" type="number" min="0" step="1" required>
                    </label>
                    <label class="wide">
                        Descripción
                        <textarea name="descripcion" maxlength="1000" required></textarea>
                    </label>
                    <label class="wide">
                        URL de imagen <span class="hint">(opcional)</span>
                        <input name="imagen" type="url" maxlength="2048" placeholder="https://ejemplo.com/imagen.jpg">
                    </label>
                </div>
                <div class="form-actions">
                    <button id="save-button" type="submit" disabled>Guardar producto</button>
                </div>
                <p id="product-status" role="status" aria-live="polite"></p>
            </form>
        </section>

        <section id="consulta-panel" role="region" aria-labelledby="consulta-tab" hidden>
            <h2>Consultar productos</h2>
            <div class="search-layout">
                <form id="product-search-form" class="search-card">
                    <h3>Buscar producto</h3>
                    <label>
                        Nombre o ID de Firestore
                        <input name="product" type="search" maxlength="120" required>
                    </label>
                    <div class="form-actions">
                        <button id="product-search-button" type="submit">Buscar producto</button>
                    </div>
                </form>
                <form id="category-search-form" class="search-card">
                    <h3>Buscar por categoría</h3>
                    <label>
                        Categoría
                        <input name="category" type="search" maxlength="80" required>
                    </label>
                    <div class="form-actions">
                        <button id="category-search-button" type="submit">Buscar categoría</button>
                    </div>
                </form>
            </div>
            <section id="results-section" aria-labelledby="results-title" hidden>
                <h2 id="results-title">Resultados</h2>
                <div class="form-actions no-print">
                    <button id="print-button" class="secondary" type="button">Imprimir resultados</button>
                </div>
                <p id="query-status" role="status" aria-live="polite"></p>
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th scope="col">ID</th>
                                <th scope="col">Nombre</th>
                                <th scope="col">Categoría</th>
                                <th scope="col">Precio</th>
                                <th scope="col">Stock</th>
                                <th scope="col">Descripción</th>
                            </tr>
                        </thead>
                        <tbody id="results-body"></tbody>
                    </table>
                </div>
            </section>
        </section>
    </main>

    <script>
        const productForm = document.querySelector("#product-form");
        const saveButton = document.querySelector("#save-button");
        const productStatus = document.querySelector("#product-status");
        const productSearchForm = document.querySelector("#product-search-form");
        const categorySearchForm = document.querySelector("#category-search-form");
        const productSearchButton = document.querySelector("#product-search-button");
        const categorySearchButton = document.querySelector("#category-search-button");
        const queryStatus = document.querySelector("#query-status");
        const resultsSection = document.querySelector("#results-section");
        const resultsBody = document.querySelector("#results-body");
        const printButton = document.querySelector("#print-button");
        let token = sessionStorage.getItem("accessToken");

        if (!token) {
            window.location.replace("/");
        } else {
            saveButton.disabled = false;
        }

        document.querySelector("#logout-button").addEventListener("click", () => {
            sessionStorage.removeItem("accessToken");
            window.location.replace("/");
        });

        const tabs = [
            { button: document.querySelector("#alta-tab"), panel: document.querySelector("#alta-panel") },
            { button: document.querySelector("#consulta-tab"), panel: document.querySelector("#consulta-panel") }
        ];

        tabs.forEach((tab) => {
            tab.button.addEventListener("click", () => {
                tabs.forEach((item) => {
                    const selected = item === tab;
                    item.button.setAttribute("aria-pressed", String(selected));
                    item.panel.hidden = !selected;
                });
            });
        });

        function setStatus(element, message, kind) {
            element.textContent = message;
            element.dataset.kind = kind || "";
        }

        async function readResponse(response) {
            const body = await response.json().catch(() => ({}));
            if (response.status === 404 && body.message === "Producto/s no encontrado/s") {
                return { data: [] };
            }
            if (!response.ok) {
                if (response.status === 401 || response.status === 403) {
                    const error = new Error("La sesión venció o no es válida. Inicia sesión nuevamente.");
                    error.status = response.status;
                    throw error;
                }
                throw new Error(body.message || body.mensaje || "No se pudo completar la solicitud.");
            }
            return body;
        }

        async function searchProducts(url) {
            const response = await fetch(url);
            const result = await readResponse(response);
            if (!Array.isArray(result.data)) {
                throw new Error("La API devolvió una respuesta de productos no válida.");
            }
            return result.data;
        }

        function showResults(products, message) {
            resultsBody.replaceChildren();
            resultsSection.hidden = false;
            setStatus(queryStatus, message, products.length ? "success" : "");
            printButton.hidden = products.length === 0;

            products.forEach((product) => {
                const row = document.createElement("tr");
                [
                    ["ID", product.id],
                    ["Nombre", product.nombre],
                    ["Categoría", product.categoria],
                    ["Precio", product.precio],
                    ["Stock", product.stock],
                    ["Descripción", product.descripcion]
                ].forEach(([label, value]) => {
                    const cell = document.createElement("td");
                    const mobileLabel = document.createElement("span");
                    mobileLabel.className = "cell-label";
                    mobileLabel.textContent = label;
                    cell.append(mobileLabel, document.createTextNode(
                        value === undefined || value === null ? "—" : String(value)
                    ));
                    row.append(cell);
                });
                resultsBody.append(row);
            });
        }

        function handleSessionError(error) {
            if (error.status === 401 || error.status === 403) {
                token = null;
                sessionStorage.removeItem("accessToken");
                window.location.replace("/");
            }
        }

        productForm.addEventListener("submit", async (event) => {
            event.preventDefault();
            if (!token) {
                setStatus(productStatus, "Inicia sesión antes de guardar.", "error");
                return;
            }

            saveButton.disabled = true;
            setStatus(productStatus, "Guardando producto...", "");

            const formData = new FormData(productForm);
            const product = {
                nombre: formData.get("nombre").trim(),
                categoria: formData.get("categoria").trim(),
                precio: Number(formData.get("precio")),
                stock: Number(formData.get("stock")),
                descripcion: formData.get("descripcion").trim()
            };
            const imageUrl = formData.get("imagen").trim();
            if (imageUrl) {
                product.imagen = imageUrl;
            }

            try {
                const response = await fetch("/api/products/create", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${token}`
                    },
                    body: JSON.stringify(product)
                });
                const result = await readResponse(response);
                setStatus(productStatus, `Producto guardado correctamente. ID: ${result.data.id}`, "success");
                productForm.reset();
            } catch (error) {
                setStatus(productStatus, error.message || "No se pudo guardar el producto.", "error");
                handleSessionError(error);
            } finally {
                if (token) {
                    saveButton.disabled = false;
                }
            }
        });

        productSearchForm.addEventListener("submit", async (event) => {
            event.preventDefault();
            productSearchButton.disabled = true;
            setStatus(queryStatus, "Buscando producto...", "");

            try {
                const query = new FormData(productSearchForm).get("product").trim();
                const products = await searchProducts("/api/products");
                const normalizedQuery = query.toLocaleLowerCase();
                const matches = products.filter((product) =>
                    String(product.id || "").toLocaleLowerCase() === normalizedQuery ||
                    String(product.nombre || "").toLocaleLowerCase().includes(normalizedQuery)
                );
                showResults(matches, matches.length
                    ? `${matches.length} producto(s) encontrado(s).`
                    : "No se encontraron productos con ese nombre o ID.");
            } catch (error) {
                resultsSection.hidden = false;
                setStatus(queryStatus, error.message || "No se pudo buscar el producto.", "error");
                handleSessionError(error);
            } finally {
                productSearchButton.disabled = false;
            }
        });

        categorySearchForm.addEventListener("submit", async (event) => {
            event.preventDefault();
            categorySearchButton.disabled = true;
            setStatus(queryStatus, "Buscando categoría...", "");

            try {
                const category = new FormData(categorySearchForm).get("category").trim();
                const query = new URLSearchParams({ category });
                const products = await searchProducts(`/api/products?${query.toString()}`);
                showResults(products, products.length
                    ? `${products.length} producto(s) encontrado(s) en la categoría "${category}".`
                    : `No se encontraron productos en la categoría "${category}".`);
            } catch (error) {
                resultsSection.hidden = false;
                setStatus(queryStatus, error.message || "No se pudo buscar la categoría.", "error");
                handleSessionError(error);
            } finally {
                categorySearchButton.disabled = false;
            }
        });

        printButton.addEventListener("click", () => {
            window.print();
        });
    </script>
</body>
</html>
